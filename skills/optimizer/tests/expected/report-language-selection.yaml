required:
  - produce the default user-facing report in Russian for the Russian request even though the audited artifact is English
  - translate report headings and explanatory prose consistently
  - preserve code paths commands identifiers schema keys and exact evidence quotations unless translation is requested
  - avoid asking a language clarification when the request already provides a reliable signal
  - use Spanish when the user explicitly requests the report in Spanish
  - keep machine schemas canonical and localize only human-readable content when required
forbidden:
  - choose English merely because the source artifact is English
  - mix report headings in English with Russian explanatory prose without a user requirement
  - translate SKILL.md file paths command names or schema keys automatically
  - let an older conversational language override a newer explicit language request
