schema_version: 1
id: task-execution
selector: orchestrator.workflow.select_execution_route
policy_inputs:
  mode: [quick, standard, deep]
  risk: [low, medium, high, critical]
  security_sensitive: boolean
  test_design_required: boolean
  approval_required: boolean
  documentation_impact: boolean
mandatory_steps:
  - freshness
  - workspace-binding
  - retrieve-context
  - implement
  - run-tests
  - security-review
  - finalize-task
conditional_steps:
  design-tests: mode != quick or test_design_required
  task-review: mode != quick
  code-review: mode != quick or security_sensitive or risk in [high, critical]
  independent-review: mode == deep or security_sensitive or risk in [high, critical]
  approvals: approval_required
  documentation: documentation_impact
finalization:
  receipt: required
  binds: [task-id, context-revision, baseline-hash, checkpoint, changed-paths]
  gates: [documentation, knowledge, memory]
  pending-approval: waiting_user
security_depth:
  deterministic: mode != deep and not security_sensitive and risk in [low, medium]
  semantic: mode == deep or security_sensitive or risk in [high, critical]
stop_conditions:
  - scope_change
  - waiting_user
  - blocked
  - workspace_mismatch
  - integration_conflict
evidence_required: true
workspace_assignment:
  serial: main
  isolated_parallel:
    sequence_1: main
    sequence_2_plus: task-owned-worktree
  checkpoint_scope: assigned-workspace
context_pack:
  capability: context.retrieve
  freshness: required
  empty_store: valid_noop
  budgets:
    quick_chars: 2048
    standard_chars: 6144
    deep_chars: 12288
