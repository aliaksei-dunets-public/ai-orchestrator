name: Import Graph documentation

on:
  push:
    branches:
      - main
    paths:
      - 'Graph/.import/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct documentation archive
        shell: bash
        run: |
          set -euo pipefail
          cat Graph/.import/chunk-* > /tmp/graph-docs.b64
          base64 --decode /tmp/graph-docs.b64 > /tmp/graph-docs.tar.gz
          rm -rf Graph
          tar -xzf /tmp/graph-docs.tar.gz -C .

      - name: Commit imported documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A Graph
          if git diff --cached --quiet; then
            echo 'No documentation changes to commit.'
            exit 0
          fi
          git commit -m 'docs: add Graph design workshop documentation'
          git push origin HEAD:main
