[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator-onboarding"
version = "0.1.0"
description = "Preview/apply project onboarding for Orchestrator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
orchestrator-onboarding = "orchestrator_onboarding.onboarding:main"

[tool.setuptools.packages.find]
where = ["src"]
