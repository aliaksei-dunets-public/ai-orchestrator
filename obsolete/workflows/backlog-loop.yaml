schema_version: 1
id: backlog-loop
limits:
  max_tasks: required
  max_seconds: required
  max_steps: required
execution:
  mode: [serial, isolated_parallel]
  default: serial
  max_workers: bounded
serial_branch_policy:
  workspace: primary
  branch: current
  forbidden: [task-branch, worktree, integration, cleanup]
steps:
  serial:
    - claim-next
    - retrieve-context
    - task-execution
    - finalize-task
    - commit-task
    - complete-task
  isolated_parallel:
    - claim-main-bootstrap
    - retrieve-context
    - task-execution
    - finalize-main-bootstrap
    - commit-main-bootstrap
    - allocate-task-worktrees
    - bounded-worktree-execution
    - finalize-worktree-tasks
    - review-and-integrate
    - ownership-checked-cleanup
stop_conditions: [empty, limit, waiting_user, blocked, failed]
commit_per_task: true
integration_conflicts: stop-and-preserve
post_loop:
  - session-report
  - propose-session-memory-candidates
