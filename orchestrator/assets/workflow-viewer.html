<!doctype html>

<title>Orchestrator · инспектор процесса</title>
<style>
:root{color-scheme:light;--paper:#f4f1e8;--ink:#192f2b;--muted:#54675e;--line:#cbd3c8;--accent:#16664d;--soft:#e1e9dd;--warning:#915826}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px "Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #ba652a;outline-offset:3px}
header{padding:24px 32px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:24px;align-items:center}.brand{font:12px Consolas,monospace;letter-spacing:2px;color:var(--accent)}h1{font:normal 29px Georgia,serif;margin:9px 0 6px}header p{margin:0;color:var(--muted);max-width:760px}.stamp{font:12px Consolas,monospace;text-align:right;white-space:nowrap}.stamp strong{display:block;color:var(--accent);margin-bottom:8px}

<body>
<header><div><div class="brand">ORCHESTRATOR / PROCESS ATLAS</div><h1 id="title">Инспектор процесса</h1><p>Проверенное определение. Выберите узел, раскройте подграф и изучите маршруты.</p></div><div class="stamp"><strong>СНИМОК ОПРЕДЕЛЕНИЯ</strong><span>Действия не запускаются</span></div></header>
<div class="toolbar"><nav id="crumbs" class="crumbs" aria-label="Уровни графа"></nav><label class="search">Найти узел <input id="search" type="search" placeholder="Название или ID" autocomplete="off"></label><div class="tools"><button id="zoom-out" aria-label="Уменьшить масштаб">−</button><output id="zoom-value" aria-live="polite">100%</output><button id="zoom-in" aria-label="Увеличить масштаб">+</button><button id="fit">Вписать</button></div></div>
<main><section class="workspace" aria-label="Схема процесса"><div class="layer-title"><h2 id="layer-title"></h2><span id="layer-count"></span></div><div id="results" class="search-results" aria-live="polite"></div><div id="canvas" class="canvas"><svg id="graph" role="img" aria-label="Узлы и переходы текущего графа"></svg></div><div class="hint">Клик — карточка · двойной клик по подграфу — раскрыть · перетаскивание фона — переместить</div></section><aside id="inspector" aria-label="Карточка выбранного элемента" aria-live="polite"></aside></main>
<footer id="digest"></footer>
<script id="workflow-data" type="application/json">__WORKFLOW_DATA__</script>
<script>
"use strict";
const data=JSON.parse(document.getElementById("workflow-data").textContent),root=data.tree;
const byId=new Map(),parents=new Map();
function index(node,parent){byId.set(node.id,node);if(parent)parents.set(node.id,parent);Object.values(node.children||{}).forEach(n=>index(n,node));}index(root,null);

const $=id=>document.getElementById(id),svg=$("graph"),NS="http://www.w3.org/2000/svg";

function showNode(node){selection=node.id;render();const box=$("inspector");box.replaceChildren();const d=node.definition,m=d.component;box.append(el("div",{class:"tag"},m.kind.toUpperCase()+" · "+node.ref),el("h2",{},m.title),el("p",{},m.description),el("div",{class:"mono"},node.id));
 if(node.children){const btn=el("button",{class:"open-subgraph","data-action":"open-subgraph"},"Раскрыть подграф →");btn.onclick=()=>open(node);box.append(btn);}
 section("Входные контракты",d.inputs||{});section("Выходные контракты",d.outputs||{});section("Исходы",d.outcomes);section("Привязки входов",node.inputs);section("Переходы",node.transitions);
 section("Исполнитель",node.execution);if(node.execution.model_profile){section("Связанный профиль",data.model_profiles[node.execution.model_profile]);box.append(el("p",{class:"notice"},"Указана политика выбора модели. Фактическое исполнение этим инспектором не подтверждается."));}
 section("Настройки",node.config);section("Объявленные эффекты",d.effects||{});section("Лимиты",{max_results:data.runtime.max_results,...(node.children?{}:{node_limit:data.runtime.node_limits[node.id]||"общий бюджет"})});
 section("Происхождение значений",node.provenance);const details=el("details");details.append(el("summary",{},"Определение / TOML-таблица экземпляра"),el("pre",{},"[nodes.\""+node.id+"\"]\n\n"+JSON.stringify(d,null,2)));box.append(details);
 const contracts=el("details");contracts.append(el("summary",{},"Схемы контрактов"),el("pre",{},JSON.stringify(Object.fromEntries([...Object.values(d.inputs||{}),...Object.values(d.outputs||{})].map(cid=>[cid,data.contracts[cid]])),null,2)));box.append(contracts);
}
function showEdge(source,target,outcomes,key){selection=key;render();$("inspector").replaceChildren();$("inspector").append(el("div",{class:"tag"},"ПЕРЕХОД"),el("h2",{},source.definition.component.title+" → "+target),el("p",{},"Исходы: "+outcomes.join(", ")));

 if(target.startsWith("exit:")){section("Возвращаемые артефакты",current.definition.exits[target.slice(5)]||{});}else{const dest=current.children[target];section("Привязки целевого узла",dest.inputs);section("Передача из источника",Object.fromEntries(Object.entries(dest.inputs).filter(([,b])=>b.startsWith(Object.keys(current.children).find(k=>current.children[k]===source)+"."))));}

}
function open(node){current=node;selection=null;zoom=1;offset={x:0,y:0};render();showNode(node);}
function updateView(){svg.setAttribute("viewBox",`${offset.x} ${offset.y} ${base.w/zoom} ${base.h/zoom}`);$("zoom-value").textContent=Math.round(zoom*100)+"%";}
function render(){svg.replaceChildren();$("layer-title").textContent=current.definition.component.title;const children=Object.entries(current.children||{});$("layer-count").textContent=children.length+" блоков";const crumb=$("crumbs");crumb.replaceChildren();const chain=[];for(let n=current;n;n=parents.get(n.id))chain.unshift(n);chain.forEach((n,i)=>{if(i)crumb.append(el("span",{},"/"));const btn=el("button",{},i===0?"Процесс":n.definition.component.title);btn.onclick=()=>open(n);crumb.append(btn);});
 const defs=s("defs"),marker=s("marker",{id:"arrow",viewBox:"0 0 10 10",refX:9,refY:5,markerWidth:6,markerHeight:6,orient:"auto-start-reverse"});marker.append(s("path",{d:"M 0 0 L 10 5 L 0 10 z",fill:"#6a8577"}));defs.append(marker);svg.append(defs);
 const ordered=[],visited=new Set(),queue=[current.definition.component.entry];while(queue.length){const name=queue.shift();if(visited.has(name)||!current.children[name])continue;visited.add(name);ordered.push([name,current.children[name]]);Object.values(current.children[name].transitions).forEach(t=>{if(!t.startsWith("exit:"))queue.push(t);});}const exits=Object.keys(current.definition.outcomes||{}).map(o=>["exit:"+o,null]);const items=[...ordered,...exits],cols=Math.min(3,Math.max(1,ordered.length,exits.length)),positions=new Map(),exitRow=Math.ceil(ordered.length/cols);base={w:cols*400+90,h:Math.max(340,(exitRow+Math.ceil(exits.length/cols))*210+90)};ordered.forEach(([name],i)=>positions.set(name,{x:50+(i%cols)*400,y:65+Math.floor(i/cols)*210}));exits.forEach(([name],i)=>positions.set(name,{x:50+(i%cols)*400,y:65+(exitRow+Math.floor(i/cols))*210}));
 const edges=new Map();children.forEach(([name,node])=>Object.entries(node.transitions).forEach(([o,t])=>{const key=name+"→"+t;if(!edges.has(key))edges.set(key,{source:node,name,target:t,outcomes:[]});edges.get(key).outcomes.push(o);}));
 edges.forEach((e,key)=>{const a=positions.get(e.name),b=positions.get(e.target);if(!b)return;const down=b.y>a.y,x1=a.x+(down?122:245),y1=a.y+(down?98:49),x2=b.x+(down?122:0),y2=b.y+(down?0:49);const group=s("g",{class:"edge"+(selection===key?" selected":""),"data-edge":key,role:"button",tabindex:0,"aria-label":e.name+" → "+e.target+": "+e.outcomes.join(", ")});const d=e.name===e.target?`M ${x1} ${y1} C ${x1+95} ${y1-115},${a.x-85} ${y1-115},${a.x} ${y1}`:down?`M ${x1} ${y1} C ${x1} ${y1+55},${x2} ${y2-55},${x2} ${y2}`:`M ${x1} ${y1} C ${x1+48} ${y1},${x2-48} ${y2},${x2} ${y2}`;group.append(s("path",{d,"marker-end":"url(#arrow)"}),s("path",{d,class:"hit"}),s("text",{x:(x1+x2)/2+(down?25:0),y:(y1+y2)/2-12,"text-anchor":"middle"},e.outcomes.join(" / ")));group.onclick=()=>showEdge(e.source,e.target,e.outcomes,key);group.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();group.onclick();}};svg.append(group);});
 const query=$("search").value.toLowerCase();items.forEach(([name,node])=>{const p=positions.get(name),title=node?node.definition.component.title:name.slice(5),kind=node?(node.children?"SUBGRAPH · раскрыть":"NODE · "+node.execution.kind):"ВЫХОД ГРАФА";const matching=!query||(node?(node.id+" "+title).toLowerCase().includes(query):title.includes(query));const group=s("g",{class:"node "+(node?(node.children?"subgraph":""):"exit")+(selection===(node?node.id:name)?" selected":"")+(!matching?" dim":""),transform:`translate(${p.x},${p.y})`,role:"button",tabindex:0,"data-node":node?node.id:name,"aria-label":title});group.append(s("rect",{width:245,height:98,rx:4}),s("text",{x:15,y:23,class:"node-kind"},kind),s("text",{x:15,y:51,class:"node-title"},title.length>25?title.slice(0,24)+"…":title),s("text",{x:15,y:77,class:"node-ref"},node?node.ref:name));group.onclick=()=>node?showNode(node):showExit(name);group.ondblclick=()=>{if(node&&node.children)open(node);};group.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();group.onclick();}};svg.append(group);});updateView();}
function showExit(name){selection=name;render();$("inspector").replaceChildren();$("inspector").append(el("div",{class:"tag"},"ВЫХОД ПОДГРАФА"),el("h2",{},name.slice(5)),el("p",{},"Дальнейший маршрут задаёт вызывающий граф."));section("Обязательные порты",{ports:current.definition.outcomes[name.slice(5)]});section("Bindings",current.definition.exits[name.slice(5)]);}
$("title").textContent=root.definition.component.title;document.title="Orchestrator · "+root.definition.component.title;$("digest").textContent=data.digest+" · дерево определения и compiled Graph связаны в одном снимке";
$("zoom-in").onclick=()=>{zoom=Math.min(2.5,zoom+.2);updateView();};$("zoom-out").onclick=()=>{zoom=Math.max(.4,zoom-.2);updateView();};$("fit").onclick=()=>{zoom=1;offset={x:0,y:0};updateView();};
$("search").oninput=()=>{render();const q=$("search").value.trim().toLowerCase(),box=$("results");box.replaceChildren();if(!q)return;let count=0;for(const node of byId.values()){if(node===root||!(node.id+" "+node.definition.component.title).toLowerCase().includes(q))continue;if(count++>=20)break;const btn=el("button",{},node.id);btn.onclick=()=>{current=parents.get(node.id)||root;zoom=1;offset={x:0,y:0};showNode(node);};box.append(btn);}if(!count)box.append(el("span",{},"Узлы не найдены"));};
